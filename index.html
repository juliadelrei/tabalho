<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Document</title>
</head>

<body class="JHFcorpo">

    <header class="JHFcabecalho">

        <button class="JHFbotaoReiniciar"></button>

        <div class="JHFareaTopo">

            <img
                class="JHFamongTopo"
                src="./assets/among-15.png"
                alt=""
            >

            <div class="JHFinformacoes">

                <p class="JHFinstrucao">
                    Adivinhe a palavra secreta de 5 letras.
                </p>

                <div class="JHFcontador">

                    <p class="JHFnumeroTentativas">
                        <span class="JHFtentativaAtual">1</span>
                        <span class="JHFtentativaTotal">/6</span>
                    </p>

                    <p class="JHFtextoTentativas">
                        TENTATIVAS
                    </p>

                </div>

            </div>

        </div>

    </header>


    <main class="JHFprincipal">

        <section class="JHFjogo">

            <!-- CAMPO PARA DIGITAR A PALAVRA -->
            <input
                class="JHFcampoPalavra"
                type="text"
                maxlength="5"
                placeholder="Acerte a senha"
            >

            <!-- BOTÃO DE ENVIAR -->
            <button class="JHFbotaoEnviar">
                ENVIAR
            </button>

            <p class="JHFmensagem"></p>


            <!-- TABULEIRO -->
            <div class="JHFtabuleiro">

                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>


                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>


                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>


                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>


                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>


                <div class="JHFlinha">

                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>
                    <div class="JHFquadrado"></div>

                </div>

            </div>

        </section>

    </main>


    <section class="JHFtelaResultado JHFescondido">

        <div class="JHFconteudoResultado">

            <img
                class="JHFamongResultado"
                src="./assets/among-15.png"
                alt=""
            >

            <h1 class="JHFtituloResultado">
                Vitória
            </h1>

        </div>

        <button class="JHFbotaoFechar"></button>

    </section>


    <script src="./script.js"></script>

</body>

</html>
